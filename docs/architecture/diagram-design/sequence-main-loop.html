<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agent CLI · Main Agent Loop Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1240px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>AI Agent CLI · Main agent loop</h1>

    <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seq-title seq-desc">
      <title id="seq-title">AI Agent CLI · Main agent loop</title>
      <desc id="seq-desc">Sequence diagram showing the main agent loop: User sends request, CLI initializes AgentLoop, AgentLoop calls Provider.complete, processes tool calls via ToolRegistry, checks permissions via PermissionGate, and returns response to User.</desc>
      <defs>
        <marker id="arrow-filled" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-filled-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
        </marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        </marker>
        <marker id="arrow-return" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines -->
      <!-- User -->
      <line x1="100" y1="60" x2="100" y2="680" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <rect x="50" y="20" width="100" height="36" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="100" y="44" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User</text>

      <!-- CLI -->
      <line x1="280" y1="60" x2="280" y2="680" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <rect x="230" y="20" width="100" height="36" rx="4" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
      <text x="280" y="44" fill="#bf4520" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CLI</text>

      <!-- AgentLoop -->
      <line x1="460" y1="60" x2="460" y2="680" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <rect x="410" y="20" width="100" height="36" rx="4" fill="rgba(191,69,32,0.04)" stroke="#bf4520" stroke-width="1.5"/>
      <text x="460" y="44" fill="#bf4520" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AgentLoop</text>

      <!-- Provider -->
      <line x1="640" y1="60" x2="640" y2="680" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <rect x="590" y="20" width="100" height="36" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="640" y="44" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Provider</text>

      <!-- ToolRegistry -->
      <line x1="820" y1="60" x2="820" y2="680" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <rect x="770" y="20" width="100" height="36" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="820" y="44" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ToolRegistry</text>

      <!-- PermissionGate -->
      <line x1="900" y1="60" x2="900" y2="680" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <rect x="850" y="20" width="100" height="36" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="900" y="44" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PermissionGate</text>

      <!-- Activation bars -->
      <!-- CLI activation -->
      <rect x="276" y="80" width="8" height="580" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <!-- AgentLoop activation -->
      <rect x="456" y="120" width="8" height="520" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <!-- Provider activation -->
      <rect x="636" y="200" width="8" height="120" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <!-- ToolRegistry activation -->
      <rect x="816" y="360" width="8" height="80" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <!-- PermissionGate activation -->
      <rect x="896" y="340" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Messages -->
      <!-- 1. User -> CLI: request -->
      <line x1="100" y1="100" x2="280" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="170" y="80" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="198" y="90" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">request</text>

      <!-- 2. CLI -> AgentLoop: initialize -->
      <line x1="280" y1="140" x2="460" y2="140" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-filled-accent)"/>
      <rect x="340" y="120" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="364" y="130" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">initialize</text>

      <!-- 3. CLI -> AgentLoop: add_user_message -->
      <line x1="280" y1="180" x2="460" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="340" y="160" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="376" y="170" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">add_user_message</text>

      <!-- 4. CLI -> AgentLoop: run -->
      <line x1="280" y1="220" x2="460" y2="220" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-filled-accent)"/>
      <rect x="340" y="200" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="356" y="210" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">run</text>

      <!-- 5. AgentLoop -> Provider: complete -->
      <line x1="460" y1="260" x2="640" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="520" y="240" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="548" y="250" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">complete</text>

      <!-- 6. Provider --> AgentLoop: ModelResponse -->
      <line x1="640" y1="320" x2="460" y2="320" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-filled-accent)"/>
      <rect x="520" y="300" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="310" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ModelResponse</text>

      <!-- 7. AgentLoop -> PermissionGate: check (for each tool) -->
      <line x1="460" y1="380" x2="900" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="600" y="360" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="628" y="370" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">check</text>

      <!-- 8. PermissionGate --> AgentLoop: allowed/denied -->
      <line x1="900" y1="400" x2="460" y2="400" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-return)"/>
      <rect x="600" y="380" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="624" y="390" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">allowed</text>

      <!-- 9. AgentLoop -> ToolRegistry: execute -->
      <line x1="460" y1="440" x2="820" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="580" y="420" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="608" y="430" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">execute</text>

      <!-- 10. ToolRegistry --> AgentLoop: ToolResult -->
      <line x1="820" y1="480" x2="460" y2="480" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-return)"/>
      <rect x="580" y="460" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="612" y="470" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ToolResult</text>

      <!-- 11. AgentLoop -> Provider: complete (with tool results) -->
      <line x1="460" y1="520" x2="640" y2="520" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="520" y="500" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="548" y="510" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">complete</text>

      <!-- 12. Provider --> AgentLoop: ModelResponse (final) -->
      <line x1="640" y1="580" x2="460" y2="580" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-filled-accent)"/>
      <rect x="520" y="560" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="570" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ModelResponse</text>

      <!-- 13. AgentLoop --> CLI: response -->
      <line x1="460" y1="620" x2="280" y2="620" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-filled-accent)"/>
      <rect x="340" y="600" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="368" y="610" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">response</text>

      <!-- 14. CLI --> User: response -->
      <line x1="280" y1="660" x2="100" y2="660" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-filled-accent)"/>
      <rect x="170" y="640" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="198" y="650" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">response</text>

      <!-- Combined fragment: Tool execution loop (opt) -->
      <rect x="452" y="360" width="460" height="160" rx="4"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="452" y="360" width="40" height="16" rx="2"
            fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="472" y="372" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle"
            letter-spacing="0.12em">OPT</text>
      <text x="472" y="396" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle"
            letter-spacing="0.04em">[if tool calls]</text>

      <!-- Legend -->
      <line x1="40" y1="690" x2="960" y2="690" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="706" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="40" y1="722" x2="68" y2="722" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <text x="76" y="726" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sync call</text>

      <line x1="220" y1="722" x2="248" y2="722" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-filled-accent)"/>
      <text x="256" y="726" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Headline call / response</text>

      <line x1="440" y1="722" x2="268" y2="722" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-return)"/>
      <text x="476" y="726" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return (dashed)</text>

      <line x1="660" y1="722" x2="688" y2="722" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-open)"/>
      <text x="696" y="726" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Async / fire-and-forget</text>

      <rect x="40" y="740" width="100" height="24" rx="4"
            fill="rgba(191,69,32,0.04)" stroke="#bf4520" stroke-width="1.5"/>
      <text x="90" y="756" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal actor</text>

      <rect x="160" y="740" width="100" height="24" rx="4"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="210" y="756" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Combined fragment</text>
    </svg>
  </div>
</body>
</html>
