<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agent CLI · Completion Review Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1240px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>AI Agent CLI · Completion review loop</h1>

    <svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="comp-title comp-desc">
      <title id="comp-title">AI Agent CLI · Completion review loop</title>
      <desc id="comp-desc">Sequence diagram showing the completion review flow: CLI runs CompletionResolver, which calls AgentLoop to execute request, then reviews the result via Provider, and retries up to max_attempts if incomplete.</desc>
      <defs>
        <marker id="arrow-filled" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-filled-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
        </marker>
        <marker id="arrow-return" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines -->
      <!-- CLI -->
      <line x1="100" y1="60" x2="100" y2="630" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <rect x="50" y="20" width="100" height="36" rx="4" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
      <text x="100" y="44" fill="#bf4520" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CLI</text>

      <!-- CompletionResolver -->
      <line x1="280" y1="60" x2="280" y2="630" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <rect x="230" y="20" width="100" height="36" rx="4" fill="rgba(191,69,32,0.04)" stroke="#bf4520" stroke-width="1.5"/>
      <text x="280" y="44" fill="#bf4520" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CompletionResolver</text>

      <!-- AgentLoop -->
      <line x1="460" y1="60" x2="460" y2="630" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <rect x="410" y="20" width="100" height="36" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="460" y="44" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AgentLoop</text>

      <!-- Provider -->
      <line x1="640" y1="60" x2="640" y2="630" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <rect x="590" y="20" width="100" height="36" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="640" y="44" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Provider</text>

      <!-- Activation bars -->
      <rect x="96" y="80" width="8" height="530" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="276" y="120" width="8" height="490" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="456" y="200" width="8" height="300" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="636" y="240" width="8" height="100" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Messages -->
      <!-- 1. CLI -> CompletionResolver: run(agent, request) -->
      <line x1="100" y1="100" x2="280" y2="100" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-filled-accent)"/>
      <rect x="170" y="80" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="194" y="90" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">run</text>

      <!-- 2. CompletionResolver -> AgentLoop: run(noTool, prompt) -->
      <line x1="280" y1="160" x2="460" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="340" y="140" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="356" y="150" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">run</text>

      <!-- 3. AgentLoop -> Provider: complete -->
      <line x1="460" y1="220" x2="640" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="520" y="200" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="548" y="210" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">complete</text>

      <!-- 4. Provider --> AgentLoop: ModelResponse -->
      <line x1="640" y1="280" x2="460" y2="280" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-filled-accent)"/>
      <rect x="520" y="260" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="270" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ModelResponse</text>

      <!-- 5. AgentLoop --> CompletionResolver: response -->
      <line x1="460" y1="340" x2="280" y2="340" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-filled-accent)"/>
      <rect x="340" y="320" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="368" y="330" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">response</text>

      <!-- Combined fragment: loop [attempts < max_attempts] -->
      <rect x="272" y="360" width="200" height="220" rx="4"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="272" y="360" width="40" height="16" rx="2"
            fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="292" y="372" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle"
            letter-spacing="0.12em">LOOP</text>
      <text x="292" y="396" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle"
            letter-spacing="0.04em">[attempts < max]</text>

      <!-- 6. CompletionResolver -> Provider: complete (review) -->
      <line x1="280" y1="420" x2="640" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="420" y="400" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="448" y="410" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">complete</text>

      <!-- 7. Provider --> CompletionResolver: ModelResponse (review) -->
      <line x1="640" y1="480" x2="280" y2="480" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-filled-accent)"/>
      <rect x="420" y="460" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="460" y="470" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ModelResponse</text>

      <!-- Combined fragment: alt [complete] -->
      <rect x="272" y="500" width="200" height="100" rx="4"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="272" y="500" width="40" height="16" rx="2"
            fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="292" y="512" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle"
            letter-spacing="0.12em">ALT</text>
      <text x="292" y="536" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle"
            letter-spacing="0.04em">[complete]</text>
      <text x="292" y="556" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle"
            letter-spacing="0.04em">[else: retry]</text>

      <!-- 8. CompletionResolver -> CLI: CompletionResult (complete) -->
      <line x1="280" y1="520" x2="100" y2="520" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-filled-accent)"/>
      <rect x="170" y="500" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="210" y="510" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CompletionResult</text>

      <!-- 9. CompletionResult --> CLI: response, complete, attempts, findings -->
      <line x1="100" y1="560" x2="100" y2="560" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-filled-accent)"/>
      <rect x="50" y="540" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="100" y="550" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">done</text>

      <!-- Legend -->
      <line x1="40" y1="640" x2="960" y2="640" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="656" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="40" y1="672" x2="68" y2="672" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <text x="76" y="676" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sync call</text>

      <line x1="220" y1="672" x2="248" y2="672" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-filled-accent)"/>
      <text x="256" y="676" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Headline call / response</text>

      <line x1="440" y1="672" x2="468" y2="672" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-return)"/>
      <text x="476" y="676" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return (dashed)</text>

      <rect x="40" y="690" width="100" height="24" rx="4"
            fill="rgba(191,69,32,0.04)" stroke="#bf4520" stroke-width="1.5"/>
      <text x="90" y="706" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal actor</text>

      <rect x="160" y="690" width="100" height="24" rx="4"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="210" y="706" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Combined fragment</text>
    </svg>
  </div>
</body>
</html>
