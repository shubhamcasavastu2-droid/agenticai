<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agent CLI · Tools Layer UML Class Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1240px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">UML class · Diagram Design</p>
    <h1>AI Agent CLI · Tools layer</h1>

    <svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tools-title tools-desc">
      <title id="tools-title">AI Agent CLI · Tools layer</title>
      <desc id="tools-desc">UML class diagram showing Tool interface realized by 7 concrete tools (ReadFileTool, WriteFileTool, EditFileTool, GlobTool, GrepTool, BashTool, AskUserTool, PlanTool), managed by ToolRegistry.</desc>
      <defs>
        <marker id="uml-triangle-dashed" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
          <polygon points="0 0, 16 6, 0 12" fill="#f5f5f5" stroke="#bf4520" stroke-width="1"/>
        </marker>
        <marker id="uml-diamond-filled" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse">
          <polygon points="0 5, 9 0, 18 5, 9 10" fill="#2d3142"/>
        </marker>
        <marker id="uml-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,0 L9,4 L0,8" fill="none" stroke="#4f5d75" stroke-width="1"/>
        </marker>
        <marker id="uml-open-dashed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,0 L9,4 L0,8" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Relationships (drawn before boxes) -->
      <!-- Tool <|-- ReadFileTool -->
      <line x1="150" y1="240" x2="150" y2="140" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-triangle-dashed)"/>
      <!-- Tool <|-- WriteFileTool -->
      <line x1="350" y1="240" x2="350" y2="140" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-triangle-dashed)"/>
      <!-- Tool <|-- EditFileTool -->
      <line x1="550" y1="240" x2="550" y2="140" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-triangle-dashed)"/>
      <!-- Tool <|-- GlobTool -->
      <line x1="750" y1="240" x2="750" y2="140" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-triangle-dashed)"/>
      <!-- Tool <|-- GrepTool -->
      <line x1="150" y1="480" x2="150" y2="380" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-triangle-dashed)"/>
      <!-- Tool <|-- BashTool -->
      <line x1="350" y1="480" x2="350" y2="380" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-triangle-dashed)"/>
      <!-- Tool <|-- AskUserTool -->
      <line x1="550" y1="480" x2="550" y2="380" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-triangle-dashed)"/>
      <!-- Tool <|-- PlanTool -->
      <line x1="750" y1="480" x2="750" y2="380" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-triangle-dashed)"/>

      <!-- ToolRegistry manages Tool (composition) -->
      <line x1="450" y1="100" x2="450" y2="140" stroke="#2d3142" stroke-width="1" marker-start="url(#uml-diamond-filled)"/>

      <!-- ToolRegistry exposes ToolSchema -->
      <path d="M 450,100 H 510 Q 518,100 518,108 V 180 Q 518,188 510,188 H 450"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#uml-open)"/>

      <!-- ToolRegistry --> validate_path (uses) -->
      <path d="M 50,100 H -10 Q -18,100 -18,108 V 180 Q -18,188 -10,188 H 50"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uml-open-dashed)"/>

      <!-- BashTool --> check_deny_list (uses) -->
      <path d="M 350,560 H 410 Q 418,560 418,568 V 620 Q 418,628 410,628 H 350"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uml-open-dashed)"/>

      <!-- Class: Tool (interface, focal) -->
      <rect x="50" y="40" width="260" height="100" rx="6" fill="rgba(191,69,32,0.04)" stroke="#bf4520" stroke-width="1"/>
      <rect x="50" y="40" width="260" height="40" rx="6" fill="rgba(191,69,32,0.10)"/>
      <rect x="50" y="72" width="260" height="8" fill="rgba(191,69,32,0.10)"/>
      <line x1="50" y1="80" x2="310" y2="80" stroke="rgba(191,69,32,0.40)" stroke-width="1"/>
      <text x="180" y="56" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«interface»</text>
      <text x="180" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tool</text>
      <text x="66" y="100" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ name: str</text>
      <text x="66" y="120" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ description: str</text>
      <text x="66" y="140" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ schema: ToolSchema</text>
      <text x="66" y="160" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ execute(**kwargs): str</text>

      <!-- Class: ToolRegistry -->
      <rect x="380" y="40" width="240" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="380" y1="80" x2="620" y2="80" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="500" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ToolRegistry</text>
      <text x="396" y="100" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- _tools: dict[str,Tool]</text>
      <text x="396" y="120" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ register(tool): None</text>
      <text x="396" y="140" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ get(name): Tool | None</text>
      <text x="396" y="160" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ all(): list[Tool]</text>
      <text x="396" y="180" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ schemas(): list[ToolSchema]</text>
      <text x="396" y="200" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ execute(name, **): str</text>

      <!-- Class: ToolSchema -->
      <rect x="550" y="40" width="180" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="550" y1="80" x2="730" y2="80" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="550" y1="120" x2="730" y2="120" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="640" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ToolSchema</text>
      <text x="566" y="100" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ name: str</text>
      <text x="566" y="120" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ description: str</text>
      <text x="566" y="140" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ parameters: dict</text>

      <!-- Class: validate_path (function) -->
      <rect x="40" y="180" width="140" height="60" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="40" y="180" width="140" height="24" rx="6" fill="rgba(45,49,66,0.04)"/>
      <line x1="40" y1="204" x2="180" y2="204" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
      <text x="110" y="196" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«function»</text>
      <text x="110" y="220" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">validate_path</text>
      <text x="110" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">path validation</text>

      <!-- Class: check_deny_list (function) -->
      <rect x="40" y="560" width="140" height="60" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="40" y="560" width="140" height="24" rx="6" fill="rgba(45,49,66,0.04)"/>
      <line x1="40" y1="584" x2="180" y2="584" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
      <text x="110" y="576" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«function»</text>
      <text x="110" y="600" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">check_deny_list</text>
      <text x="110" y="620" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">command validation</text>

      <!-- Concrete Tools Row 1 -->
      <!-- ReadFileTool -->
      <rect x="50" y="240" width="200" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="50" y1="280" x2="250" y2="280" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="50" y1="320" x2="250" y2="320" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="50" y1="360" x2="250" y2="360" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="150" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ReadFileTool</text>
      <text x="66" y="300" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ project_root: Path</text>
      <text x="66" y="320" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- _truncate: Callable</text>
      <text x="66" y="340" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ execute(path, offset,</text>
      <text x="66" y="360" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">    limit): str</text>

      <!-- WriteFileTool -->
      <rect x="250" y="240" width="200" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="250" y1="280" x2="450" y2="280" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="250" y1="320" x2="450" y2="320" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="350" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">WriteFileTool</text>
      <text x="266" y="300" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ project_root: Path</text>
      <text x="266" y="320" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ execute(path, content): str</text>

      <!-- EditFileTool -->
      <rect x="450" y="240" width="200" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="450" y1="280" x2="650" y2="280" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="450" y1="320" x2="650" y2="320" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="450" y1="360" x2="650" y2="360" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="550" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">EditFileTool</text>
      <text x="466" y="300" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ project_root: Path</text>
      <text x="466" y="320" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ execute(path, old, new): str</text>
      <text x="466" y="340" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- _get_context(...): str</text>

      <!-- GlobTool -->
      <rect x="650" y="240" width="200" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="650" y1="280" x2="850" y2="280" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="650" y1="320" x2="850" y2="320" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="750" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GlobTool</text>
      <text x="666" y="300" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ project_root: Path</text>
      <text x="666" y="320" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- _truncate: Callable</text>
      <text x="666" y="340" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ execute(pattern): str</text>

      <!-- Concrete Tools Row 2 -->
      <!-- GrepTool -->
      <rect x="50" y="480" width="200" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="50" y1="520" x2="250" y2="520" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="50" y1="560" x2="250" y2="560" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="150" y="504" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GrepTool</text>
      <text x="66" y="540" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ project_root: Path</text>
      <text x="66" y="560" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- _truncate: Callable</text>
      <text x="66" y="580" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ execute(pattern, path,</text>
      <text x="66" y="600" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">    include): str</text>

      <!-- BashTool -->
      <rect x="250" y="480" width="200" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="250" y1="520" x2="450" y2="520" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="250" y1="560" x2="450" y2="560" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="350" y="504" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BashTool</text>
      <text x="266" y="540" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ project_root: Path</text>
      <text x="266" y="560" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- _truncate: Callable</text>
      <text x="266" y="580" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ execute(cmd, timeout,</text>
      <text x="266" y="600" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">    workdir): str</text>

      <!-- AskUserTool -->
      <rect x="450" y="480" width="200" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="450" y1="520" x2="650" y2="520" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="450" y1="560" x2="650" y2="560" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="550" y="504" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AskUserTool</text>
      <text x="466" y="540" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ ask_callback: AskCallback</text>
      <text x="466" y="560" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ execute(question,</text>
      <text x="466" y="580" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">    options): str</text>

      <!-- PlanTool -->
      <rect x="650" y="480" width="200" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="650" y1="520" x2="850" y2="520" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="650" y1="560" x2="850" y2="560" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="650" y1="600" x2="850" y2="600" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="750" y="504" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PlanTool</text>
      <text x="666" y="540" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ plan_callback: PlanCallback</text>
      <text x="666" y="560" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ execute(title, summary,</text>
      <text x="666" y="580" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">    steps, risks): str</text>

      <!-- Legend: relationship vocabulary -->
      <line x1="40" y1="630" x2="960" y2="630" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="646" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · RELATIONSHIPS</text>

      <line x1="40" y1="662" x2="68" y2="662" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-triangle-dashed)"/>
      <text x="76" y="666" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Realization</text>

      <line x1="220" y1="662" x2="248" y2="662" stroke="#2d3142" stroke-width="1" marker-start="url(#uml-diamond-filled)"/>
      <text x="256" y="666" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Composition · manages</text>

      <line x1="420" y1="662" x2="448" y2="662" stroke="#4f5d75" stroke-width="1" marker-end="url(#uml-open)"/>
      <text x="456" y="666" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Association · exposes</text>

      <line x1="620" y1="662" x2="648" y2="662" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uml-open-dashed)"/>
      <text x="656" y="666" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Dependency · uses</text>

      <line x1="820" y1="662" x2="848" y2="662" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uml-open-dashed)"/>
      <text x="856" y="666" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External function</text>
    </svg>
  </div>
</body>
</html>
