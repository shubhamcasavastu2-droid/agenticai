<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agent CLI · Core Types UML Class Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1240px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">UML class · Diagram Design</p>
    <h1>AI Agent CLI · Core types & message model</h1>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="core-types-title core-types-desc">
      <title id="core-types-title">AI Agent CLI · Core types & message model</title>
      <desc id="core-types-desc">UML class diagram showing the core type system: Role and StopReason enumerations, Block interface with TextBlock, ToolCall, ToolResult, ReasoningBlock implementations, Message with factory methods, ToolSchema, ModelResponse, and Tool interface.</desc>
      <defs>
        <marker id="uml-triangle" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
          <polygon points="0 0, 16 6, 0 12" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        </marker>
        <marker id="uml-triangle-dashed" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
          <polygon points="0 0, 16 6, 0 12" fill="#f5f5f5" stroke="#bf4520" stroke-width="1"/>
        </marker>
        <marker id="uml-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,0 L9,4 L0,8" fill="none" stroke="#4f5d75" stroke-width="1"/>
        </marker>
        <marker id="uml-open-dashed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,0 L9,4 L0,8" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Relationships (drawn before boxes) -->
      <!-- Block <|-- TextBlock -->
      <line x1="200" y1="240" x2="200" y2="140" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-triangle-dashed)"/>
      <!-- Block <|-- ToolCall -->
      <line x1="450" y1="240" x2="450" y2="140" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-triangle-dashed)"/>
      <!-- Block <|-- ToolResult -->
      <line x1="700" y1="240" x2="700" y2="140" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-triangle-dashed)"/>
      <!-- Block <|-- ReasoningBlock -->
      <line x1="850" y1="240" x2="850" y2="140" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-triangle-dashed)"/>

      <!-- Message --> Role (uses) -->
      <path d="M 140,420 H 80 Q 72,420 72,412 V 360 Q 72,352 80,352 H 140"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uml-open-dashed)"/>

      <!-- ModelResponse --> Block (contains) -->
      <path d="M 140,420 H 80 Q 72,420 72,428 V 480 Q 72,488 80,488 H 140"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#uml-open)"/>

      <!-- ModelResponse --> StopReason (uses) -->
      <path d="M 860,420 H 920 Q 928,420 928,428 V 480 Q 928,488 920,488 H 860"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uml-open-dashed)"/>

      <!-- Message contains Block -->
      <path d="M 140,340 H 80 Q 72,340 72,332 V 280 Q 72,272 80,272 H 200"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#uml-open)"/>

      <!-- Message factory methods label -->
      <rect x="160" y="332" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="180" y="341" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FACTORY</text>

      <!-- Class: Block (interface, focal) -->
      <rect x="120" y="40" width="360" height="100" rx="6" fill="rgba(191,69,32,0.04)" stroke="#bf4520" stroke-width="1"/>
      <rect x="120" y="40" width="360" height="40" rx="6" fill="rgba(191,69,32,0.10)"/>
      <rect x="120" y="72" width="360" height="8" fill="rgba(191,69,32,0.10)"/>
      <line x1="120" y1="80" x2="480" y2="80" stroke="rgba(191,69,32,0.40)" stroke-width="1"/>
      <text x="300" y="56" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«interface»</text>
      <text x="300" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Block</text>

      <!-- Class: TextBlock -->
      <rect x="100" y="240" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="100" y1="280" x2="300" y2="280" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="200" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TextBlock</text>
      <text x="116" y="300" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ text: str</text>
      <text x="116" y="320" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ type: "text"</text>

      <!-- Class: ToolCall -->
      <rect x="350" y="240" width="200" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="350" y1="280" x2="550" y2="280" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="450" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ToolCall</text>
      <text x="366" y="300" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ id: str</text>
      <text x="366" y="320" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ name: str</text>
      <text x="366" y="340" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ arguments: dict</text>
      <text x="366" y="360" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ type: "tool_call"</text>

      <!-- Class: ToolResult -->
      <rect x="600" y="240" width="200" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="600" y1="280" x2="800" y2="280" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="700" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ToolResult</text>
      <text x="616" y="300" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ call_id: str</text>
      <text x="616" y="320" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ output: str</text>
      <text x="616" y="340" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ is_error: bool</text>
      <text x="616" y="360" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ type: "tool_result"</text>

      <!-- Class: ReasoningBlock -->
      <rect x="850" y="240" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="850" y1="280" x2="1050" y2="280" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="950" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ReasoningBlock</text>
      <text x="866" y="300" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ text: str</text>
      <text x="866" y="320" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ type: "reasoning"</text>

      <!-- Class: Role (enumeration) -->
      <rect x="40" y="360" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="40" y="360" width="160" height="24" rx="6" fill="rgba(45,49,66,0.06)"/>
      <line x1="40" y1="384" x2="200" y2="384" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="120" y="376" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«enumeration»</text>
      <text x="120" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Role</text>
      <text x="120" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">USER, ASSISTANT, TOOL</text>

      <!-- Class: StopReason (enumeration) -->
      <rect x="800" y="360" width="180" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="800" y="360" width="180" height="24" rx="6" fill="rgba(45,49,66,0.06)"/>
      <line x1="800" y1="384" x2="980" y2="384" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="890" y="376" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«enumeration»</text>
      <text x="890" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">StopReason</text>
      <text x="890" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">END_TURN</text>
      <text x="890" y="440" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MAX_TOKENS</text>
      <text x="890" y="460" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TOOL_USE, ERROR</text>

      <!-- Class: Message -->
      <rect x="40" y="460" width="260" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="40" y1="500" x2="300" y2="500" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="540" x2="300" y2="540" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="170" y="484" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Message</text>
      <text x="56" y="520" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ role: Role</text>
      <text x="56" y="540" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ content: list[Block]</text>
      <text x="56" y="560" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ user(text): Message</text>
      <text x="56" y="580" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ assistant(blocks): Message</text>
      <text x="56" y="600" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ tool_result(...): Message</text>

      <!-- Class: ToolSchema -->
      <rect x="370" y="460" width="240" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="370" y1="500" x2="610" y2="500" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="370" y1="540" x2="610" y2="540" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="490" y="484" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ToolSchema</text>
      <text x="386" y="520" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ name: str</text>
      <text x="386" y="540" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ description: str</text>
      <text x="386" y="560" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ parameters: dict</text>

      <!-- Class: ModelResponse -->
      <rect x="680" y="460" width="260" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="680" y1="500" x2="940" y2="500" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="680" y1="540" x2="940" y2="540" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="810" y="484" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ModelResponse</text>
      <text x="696" y="520" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ blocks: list[Block]</text>
      <text x="696" y="540" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ stop_reason: StopReason</text>
      <text x="696" y="560" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ usage: dict | None</text>

      <!-- Class: Tool (interface) -->
      <rect x="40" y="620" width="300" height="100" rx="6" fill="rgba(191,69,32,0.04)" stroke="#bf4520" stroke-width="1"/>
      <rect x="40" y="620" width="300" height="40" rx="6" fill="rgba(191,69,32,0.10)"/>
      <rect x="40" y="652" width="300" height="8" fill="rgba(191,69,32,0.10)"/>
      <line x1="40" y1="660" x2="340" y2="660" stroke="rgba(191,69,32,0.40)" stroke-width="1"/>
      <text x="190" y="636" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«interface»</text>
      <text x="190" y="652" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tool</text>
      <text x="56" y="680" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ name: str</text>
      <text x="56" y="700" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ description: str</text>
      <text x="56" y="720" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ schema: ToolSchema</text>
      <text x="56" y="740" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ execute(**kwargs): str</text>

      <!-- Legend: relationship vocabulary -->
      <line x1="40" y1="760" x2="960" y2="760" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="776" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · RELATIONSHIPS</text>

      <line x1="40" y1="792" x2="68" y2="792" stroke="#2d3142" stroke-width="1" marker-end="url(#uml-triangle)"/>
      <text x="76" y="796" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Inheritance</text>

      <line x1="188" y1="792" x2="216" y2="792" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-triangle-dashed)"/>
      <text x="224" y="796" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Realization</text>

      <line x1="336" y1="792" x2="364" y2="792" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uml-open-dashed)"/>
      <text x="372" y="796" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Dependency · uses</text>

      <line x1="520" y1="792" x2="548" y2="792" stroke="#4f5d75" stroke-width="1" marker-end="url(#uml-open)"/>
      <text x="556" y="796" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Association · contains</text>
    </svg>
  </div>
</body>
</html>
