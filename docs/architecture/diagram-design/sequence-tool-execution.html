<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agent CLI · Tool Execution Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1240px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>AI Agent CLI · Tool execution flow</h1>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tool-seq-title tool-seq-desc">
      <title id="tool-seq-title">AI Agent CLI · Tool execution flow</title>
      <desc id="tool-seq-desc">Sequence diagram showing tool execution: AgentLoop checks PermissionGate, executes tool via ToolRegistry, concrete tool runs (ReadFileTool, WriteFileTool, BashTool), validates paths, checks deny list, returns ToolResult.</desc>
      <defs>
        <marker id="arrow-filled" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-filled-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
        </marker>
        <marker id="arrow-return" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines -->
      <!-- AgentLoop -->
      <line x1="120" y1="60" x2="120" y2="580" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <rect x="70" y="20" width="100" height="36" rx="4" fill="rgba(191,69,32,0.04)" stroke="#bf4520" stroke-width="1.5"/>
      <text x="120" y="44" fill="#bf4520" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AgentLoop</text>

      <!-- PermissionGate -->
      <line x1="280" y1="60" x2="280" y2="580" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <rect x="230" y="20" width="100" height="36" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="280" y="44" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PermissionGate</text>

      <!-- ToolRegistry -->
      <line x1="440" y1="60" x2="440" y2="580" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <rect x="390" y="20" width="100" height="36" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="440" y="44" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ToolRegistry</text>

      <!-- Concrete Tool -->
      <line x1="600" y1="60" x2="600" y2="580" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <rect x="550" y="20" width="100" height="36" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="600" y="44" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Concrete Tool</text>
      <text x="600" y="56" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">(Read/Write/Bash/...)</text>

      <!-- validate_path -->
      <line x1="760" y1="60" x2="760" y2="580" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <rect x="710" y="20" width="100" height="36" rx="4" fill="#ececec" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="760" y="44" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">validate_path</text>
      <text x="760" y="56" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">«function»</text>

      <!-- check_deny_list -->
      <line x1="920" y1="60" x2="920" y2="580" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <rect x="870" y="20" width="100" height="36" rx="4" fill="#ececec" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="920" y="44" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">check_deny_list</text>
      <text x="920" y="56" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">«function»</text>

      <!-- Activation bars -->
      <rect x="116" y="100" width="8" height="460" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="276" y="140" width="8" height="80" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="436" y="260" width="8" height="100" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="596" y="300" width="8" height="200" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="756" y="320" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="916" y="400" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Messages -->
      <!-- 1. AgentLoop -> PermissionGate: check(tool, args) -->
      <line x1="120" y1="140" x2="280" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="180" y="120" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="208" y="130" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">check</text>

      <!-- 2. PermissionGate --> AgentLoop: allowed/denied -->
      <line x1="280" y1="180" x2="120" y2="180" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-return)"/>
      <rect x="180" y="160" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="204" y="170" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">allowed</text>

      <!-- Combined fragment: alt [denied] -->
      <rect x="112" y="200" width="180" height="60" rx="4"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="112" y="200" width="40" height="16" rx="2"
            fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="132" y="212" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle"
            letter-spacing="0.12em">ALT</text>
      <text x="132" y="236" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle"
            letter-spacing="0.04em">[denied]</text>
      <line x1="120" y1="240" x2="120" y2="240" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-filled-accent)"/>
      <text x="120" y="230" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">error</text>

      <!-- 3. AgentLoop -> ToolRegistry: execute(name, kwargs) -->
      <line x1="120" y1="280" x2="440" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="250" y="260" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="278" y="270" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">execute</text>

      <!-- 4. ToolRegistry -> Concrete Tool: execute(...) -->
      <line x1="440" y1="320" x2="600" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="490" y="300" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="518" y="310" fill="#4f5d75" font-size="8" font-family"'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">execute</text>

      <!-- 5. Concrete Tool -> validate_path: path -->
      <line x1="600" y1="360" x2="760" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="660" y="340" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="684" y="350" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">validate</text>

      <!-- 6. validate_path --> Concrete Tool: validated/PathValidationError -->
      <line x1="760" y1="380" x2="600" y2="380" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-return)"/>
      <rect x="660" y="360" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="684" y="370" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">validated</text>

      <!-- 7. Concrete Tool -> check_deny_list: command (BashTool only) -->
      <line x1="600" y1="420" x2="920" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="730" y="400" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="758" y="410" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">check</text>

      <!-- 8. check_deny_list --> Concrete Tool: allowed/denied -->
      <line x1="920" y1="440" x2="600" y2="440" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-return)"/>
      <rect x="730" y="420" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="754" y="430" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">allowed</text>

      <!-- 9. Concrete Tool executes (self-message) -->
      <path d="M 600,480 H 640 Q 648,480 648,488 V 520 Q 648,528 640,528 H 600"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="610" y="480" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="634" y="490" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">execute</text>

      <!-- 10. Concrete Tool --> ToolRegistry: ToolResult -->
      <line x1="600" y1="540" x2="440" y2="540" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-filled-accent)"/>
      <rect x="490" y="520" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="522" y="530" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ToolResult</text>

      <!-- 11. ToolRegistry --> AgentLoop: ToolResult -->
      <line x1="440" y1="560" x2="120" y2="560" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-filled-accent)"/>
      <rect x="250" y="540" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="282" y="550" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ToolResult</text>

      <!-- Legend -->
      <line x1="40" y1="590" x2="960" y2="590" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="606" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="40" y1="622" x2="68" y2="622" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <text x="76" y="626" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sync call</text>

      <line x1="220" y1="622" x2="248" y2="622" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-filled-accent)"/>
      <text x="256" y="626" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Headline response</text>

      <line x1="440" y1="622" x2="468" y2="622" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-return)"/>
      <text x="476" y="626" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return (dashed)</text>

      <rect x="40" y="640" width="100" height="24" rx="4"
            fill="rgba(191,69,32,0.04)" stroke="#bf4520" stroke-width="1.5"/>
      <text x="90" y="656" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal actor</text>

      <rect x="160" y="640" width="100" height="24" rx="4"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="210" y="656" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Combined fragment</text>

      <rect x="280" y="640" width="140" height="24" rx="4"
            fill="#ececec" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="350" y="656" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External function</text>
    </svg>
  </div>
</body>
</html>
