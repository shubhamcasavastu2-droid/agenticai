<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agent CLI · Responsibility Swimlane</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · Diagram Design</p>
    <h1>AI Agent CLI · Component responsibilities</h1>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="resp-title resp-desc">
      <title id="resp-title">AI Agent CLI · Component responsibilities</title>
      <desc id="resp-desc">Swimlane diagram showing responsibilities across layers: CLI (entry, config, initialization), Agent Layer (orchestration, state, callbacks), Provider Layer (model completion, API), Tools Layer (file ops, shell, user interaction), Core Types (data structures), External (dependencies).</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Lane dividers (horizontal) -->
      <line x1="40" y1="80" x2="960" y2="80" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="160" x2="960" y2="160" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="240" x2="960" y2="240" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="320" x2="960" y2="320" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="400" x2="960" y2="400" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="480" x2="960" y2="480" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <!-- Actor column divider -->
      <line x1="160" y1="80" x2="160" y2="480" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <!-- Lane labels -->
      <text x="60" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CLI</text>
      <text x="60" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">AGENT LAYER</text>
      <text x="60" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">PROVIDER</text>
      <text x="60" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TOOLS</text>
      <text x="60" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CORE TYPES</text>
      <text x="60" y="524" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">EXTERNAL</text>

      <!-- Arrows (drawn first) -->
      <!-- CLI -> AgentLoop: initialize -->
      <path d="M 300,120 H 352 Q 360,120 360,128 V 176" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- AgentLoop -> Provider: complete -->
      <path d="M 500,224 H 552 Q 560,224 560,232 V 276" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Provider -> AgentLoop: ModelResponse -->
      <path d="M 500,280 H 448 Q 440,280 440,272 V 220" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- AgentLoop -> ToolRegistry: execute -->
      <path d="M 650,224 H 702 Q 710,224 710,232 V 336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- ToolRegistry -> Concrete Tool: execute -->
      <path d="M 650,360 H 702 Q 710,360 710,368 V 420" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Concrete Tool -> validate_path -->
      <path d="M 850,380 H 902 Q 910,380 910,388 V 440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- AgentLoop -> PermissionGate: check -->
      <path d="M 300,224 H 352 Q 360,224 360,232 V 276" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- AgentLoop -> AgentState: contains -->
      <line x1="300" y1="180" x2="300" y2="220" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- CLI -> Config: load -->
      <line x1="300" y1="100" x2="300" y2="60" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- CLI -> SkillLoader/AgentLoader: discover -->
      <path d="M 450,120 H 502 Q 510,120 510,128 V 176" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Provider -> HTTPXAsyncClient: HTTP -->

      <path d="M 650,420 H 702 Q 710,420 710,428 V 520" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <rect x="360" y="336" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
