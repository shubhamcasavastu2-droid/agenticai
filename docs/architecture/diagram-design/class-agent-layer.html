<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agent CLI · Agent Layer UML Class Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1240px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">UML class · Diagram Design</p>
    <h1>AI Agent CLI · Agent layer: state & loop</h1>

    <svg viewBox="0 0 1000 550" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-layer-title agent-layer-desc">
      <title id="agent-layer-title">AI Agent CLI · Agent layer: state & loop</title>
      <desc id="agent-layer-desc">UML class diagram showing AgentState containing Messages, and AgentLoop depending on Provider, ToolRegistry, PermissionGate, with callbacks and owning AgentState.</desc>
      <defs>
        <marker id="uml-triangle" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
          <polygon points="0 0, 16 6, 0 12" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        </marker>
        <marker id="uml-triangle-dashed" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
          <polygon points="0 0, 16 6, 0 12" fill="#f5f5f5" stroke="#bf4520" stroke-width="1"/>
        </marker>
        <marker id="uml-diamond-filled" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse">
          <polygon points="0 5, 9 0, 18 5, 9 10" fill="#2d3142"/>
        </marker>
        <marker id="uml-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,0 L9,4 L0,8" fill="none" stroke="#4f5d75" stroke-width="1"/>
        </marker>
        <marker id="uml-open-dashed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,0 L9,4 L0,8" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Relationships (drawn before boxes) -->
      <!-- AgentLoop --> Provider (uses) -->
      <path d="M 100,160 H 40 Q 32,160 32,152 V 80 Q 32,72 40,72 H 100"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uml-open-dashed)"/>

      <!-- AgentLoop --> ToolRegistry (uses) -->
      <path d="M 100,200 H 40 Q 32,200 32,208 V 280 Q 32,288 40,288 H 100"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uml-open-dashed)"/>

      <!-- AgentLoop --> PermissionGate (uses) -->
      <path d="M 100,240 H 40 Q 32,240 32,248 V 360 Q 32,368 40,368 H 100"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uml-open-dashed)"/>

      <!-- AgentLoop has AgentState (composition) -->
      <line x1="280" y1="220" x2="420" y2="220" stroke="#2d3142" stroke-width="1" marker-start="url(#uml-diamond-filled)"/>

      <!-- AgentLoop creates AgentState -->
      <path d="M 280,260 H 420 Q 428,260 428,268 V 340 Q 428,348 420,348 H 280"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uml-open-dashed)"/>

      <!-- AgentState contains Message -->
      <path d="M 620,220 H 680 Q 688,220 688,228 V 340 Q 688,348 680,348 H 620"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#uml-open)"/>

      <!-- Class: Provider (interface) -->
      <rect x="40" y="40" width="240" height="80" rx="6" fill="rgba(191,69,32,0.04)" stroke="#bf4520" stroke-width="1"/>
      <rect x="40" y="40" width="240" height="40" rx="6" fill="rgba(191,69,32,0.10)"/>
      <rect x="40" y="72" width="240" height="8" fill="rgba(191,69,32,0.10)"/>
      <line x1="40" y1="80" x2="280" y2="80" stroke="rgba(191,69,32,0.40)" stroke-width="1"/>
      <text x="160" y="56" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«interface»</text>
      <text x="160" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Provider</text>
      <text x="56" y="100" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ complete(...): ModelResponse</text>

      <!-- Class: ToolRegistry -->
      <rect x="40" y="280" width="240" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="40" y1="320" x2="280" y2="320" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="360" x2="280" y2="360" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="160" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ToolRegistry</text>
      <text x="56" y="340" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- _tools: dict[str,Tool]</text>
      <text x="56" y="360" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ register(tool): None</text>
      <text x="56" y="380" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ get(name): Tool | None</text>
      <text x="56" y="400" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ all(): list[Tool]</text>
      <text x="56" y="420" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ schemas(): list[ToolSchema]</text>
      <text x="56" y="440" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ execute(name, **): str</text>

      <!-- Class: PermissionGate -->
      <rect x="40" y="400" width="240" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="40" y1="440" x2="280" y2="440" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="480" x2="280" y2="480" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="160" y="424" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PermissionGate</text>
      <text x="56" y="460" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- _always_allow: set[str]</text>
      <text x="56" y="480" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- _auto_allow: set[str]</text>
      <text x="56" y="500" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ check(...): tuple[bool,str]</text>
      <text x="56" y="520" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ allow_always(name): None</text>
      <text x="56" y="540" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ allow_auto(name): None</text>
      <text x="56" y="560" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ deny(name): None</text>
      <text x="56" y="580" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ reset(): None</text>

      <!-- Class: AgentLoop (focal) -->
      <rect x="340" y="40" width="360" height="300" rx="6" fill="rgba(191,69,32,0.04)" stroke="#bf4520" stroke-width="1"/>
      <rect x="340" y="40" width="360" height="40" rx="6" fill="rgba(191,69,32,0.10)"/>
      <rect x="340" y="72" width="360" height="8" fill="rgba(191,69,32,0.10)"/>
      <line x1="340" y1="80" x2="700" y2="80" stroke="rgba(191,69,32,0.40)" stroke-width="1"/>
      <text x="520" y="56" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«focal»</text>
      <text x="520" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AgentLoop</text>
      <text x="356" y="100" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ provider: Provider</text>
      <text x="356" y="120" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ registry: ToolRegistry</text>
      <text x="356" y="140" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ permission_gate: PermissionGate</text>
      <text x="356" y="160" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ system_prompt: str</text>
      <text x="356" y="180" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ max_steps: int</text>
      <text x="356" y="200" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ permission_callback: Callable</text>
      <text x="356" y="220" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ reasoning_callback: Callable</text>
      <text x="356" y="240" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ tool_callback: Callable</text>
      <text x="356" y="260" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ clarification_callback: Callable</text>
      <text x="356" y="280" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ context_window_tokens: int</text>
      <text x="356" y="300" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ max_completion_tokens: int</text>
      <text x="356" y="320" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ state: AgentState</text>
      <text x="356" y="340" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ add_user_message(text): None</text>
      <text x="356" y="360" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ run(noTool, prompt): str</text>
      <text x="356" y="380" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ _execute_tool(call): ToolResult</text>
      <text x="356" y="400" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ _log_context_usage(resp): None</text>
      <text x="356" y="420" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ clear_history(): None</text>

      <!-- Class: AgentState -->
      <rect x="580" y="220" width="300" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="580" y1="260" x2="880" y2="260" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="580" y1="300" x2="880" y2="300" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="580" y1="340" x2="880" y2="340" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="730" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AgentState</text>
      <text x="596" y="280" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ messages: list[Message]</text>
      <text x="596" y="300" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ step_count: int</text>
      <text x="596" y="320" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ last_tool_calls: list[tuple]</text>
      <text x="596" y="340" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ model_output_limit_reached: bool</text>

      <!-- Class: Message (reference) -->
      <rect x="580" y="380" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="580" y1="420" x2="780" y2="420" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="680" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Message</text>
      <text x="596" y="440" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(from Core Types)</text>

      <!-- Legend: relationship vocabulary -->
      <line x1="40" y1="500" x2="960" y2="500" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · RELATIONSHIPS</text>

      <line x1="40" y1="532" x2="68" y2="532" stroke="#2d3142" stroke-width="1" marker-start="url(#uml-diamond-filled)"/>
      <text x="76" y="536" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Composition · owns</text>

      <line x1="220" y1="532" x2="248" y2="532" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uml-open-dashed)"/>
      <text x="256" y="536" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Dependency · uses</text>

      <line x1="420" y1="532" x2="448" y2="532" stroke="#4f5d75" stroke-width="1" marker-end="url(#uml-open)"/>
      <text x="456" y="536" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Association · contains</text>

      <line x1="620" y1="532" x2="648" y2="532" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-triangle-dashed)"/>
      <text x="656" y="536" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Realization</text>
    </svg>
  </div>
</body>
</html>
