<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agent CLI · Provider Layer UML Class Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1240px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">UML class · Diagram Design</p>
    <h1>AI Agent CLI · Provider layer</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="provider-title provider-desc">
      <title id="provider-title">AI Agent CLI · Provider layer</title>
      <desc id="provider-desc">UML class diagram showing Provider interface realized by OpenAICompatibleProvider (full implementation), with AnthropicProvider and GeminiProvider as stubs. Custom exceptions: ProviderTimeoutError, ProviderAuthenticationError.</desc>
      <defs>
        <marker id="uml-triangle" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
          <polygon points="0 0, 16 6, 0 12" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        </marker>
        <marker id="uml-triangle-dashed" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
          <polygon points="0 0, 16 6, 0 12" fill="#f5f5f5" stroke="#bf4520" stroke-width="1"/>
        </marker>
        <marker id="uml-open-dashed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,0 L9,4 L0,8" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Relationships (drawn before boxes) -->
      <!-- Provider <|-- OpenAICompatibleProvider -->
      <line x1="300" y1="240" x2="300" y2="140" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-triangle-dashed)"/>
      <!-- Provider <|-- AnthropicProvider -->
      <line x1="600" y1="240" x2="600" y2="140" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-triangle-dashed)"/>
      <!-- Provider <|-- GeminiProvider -->
      <line x1="850" y1="240" x2="850" y2="140" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-triangle-dashed)"/>

      <!-- OpenAICompatibleProvider --> HTTPXAsyncClient (uses) -->
      <path d="M 300,420 H 360 Q 368,420 368,428 V 480 Q 368,488 360,488 H 300"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uml-open-dashed)"/>

      <!-- Class: Provider (interface, focal) -->
      <rect x="200" y="40" width="200" height="100" rx="6" fill="rgba(191,69,32,0.04)" stroke="#bf4520" stroke-width="1"/>
      <rect x="200" y="40" width="200" height="40" rx="6" fill="rgba(191,69,32,0.10)"/>
      <rect x="200" y="72" width="200" height="8" fill="rgba(191,69,32,0.10)"/>
      <line x1="200" y1="80" x2="400" y2="80" stroke="rgba(191,69,32,0.40)" stroke-width="1"/>
      <text x="300" y="56" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«interface»</text>
      <text x="300" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Provider</text>
      <text x="216" y="100" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ complete(system,</text>
      <text x="216" y="120" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">    messages, tools):</text>
      <text x="216" y="140" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">    ModelResponse</text>

      <!-- Class: OpenAICompatibleProvider -->
      <rect x="200" y="240" width="200" height="200" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="200" y1="280" x2="400" y2="280" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="200" y1="320" x2="400" y2="320" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="200" y1="360" x2="400" y2="360" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="200" y1="400" x2="400" y2="400" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="300" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OpenAICompatibleProvider</text>
      <text x="216" y="300" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ base_url: str</text>
      <text x="216" y="320" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ api_key: str</text>
      <text x="216" y="340" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ model: str</text>
      <text x="216" y="360" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ timeout: float</text>
      <text x="216" y="380" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ max_completion_tokens: int</text>
      <text x="216" y="400" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- _client: HTTPXAsyncClient</text>
      <text x="216" y="420" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ complete(...): ModelResponse</text>
      <text x="216" y="440" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ _build_payload(...): dict</text>
      <text x="216" y="460" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ _convert_message(...): dict</text>
      <text x="216" y="480" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ _convert_tool_schema(...): dict</text>
      <text x="216" y="500" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ _parse_response(...): ModelResponse</text>
      <text x="216" y="520" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ close(): None</text>

      <!-- Class: AnthropicProvider (stub) -->
      <rect x="500" y="240" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="500" y="240" width="200" height="24" rx="6" fill="rgba(45,49,66,0.06)"/>
      <line x1="500" y1="264" x2="700" y2="264" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="600" y="256" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«stub»</text>
      <text x="600" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AnthropicProvider</text>
      <text x="516" y="300" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ complete(...): ModelResponse</text>

      <!-- Class: GeminiProvider (stub) -->
      <rect x="750" y="240" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="750" y="240" width="200" height="24" rx="6" fill="rgba(45,49,66,0.06)"/>
      <line x1="750" y1="264" x2="950" y2="264" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="850" y="256" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«stub»</text>
      <text x="850" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GeminiProvider</text>
      <text x="766" y="300" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ complete(...): ModelResponse</text>

      <!-- Class: ProviderTimeoutError -->
      <rect x="40" y="40" width="140" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="40" y="40" width="140" height="24" rx="6" fill="rgba(45,49,66,0.06)"/>
      <line x1="40" y1="64" x2="180" y2="64" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="110" y="56" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«exception»</text>
      <text x="110" y="80" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ProviderTimeoutError</text>

      <!-- Class: ProviderAuthenticationError -->
      <rect x="40" y="120" width="140" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="40" y="120" width="140" height="24" rx="6" fill="rgba(45,49,66,0.06)"/>
      <line x1="40" y1="144" x2="180" y2="144" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="110" y="136" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«exception»</text>
      <text x="110" y="160" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ProviderAuthError</text>

      <!-- Class: HTTPXAsyncClient (external) -->
      <rect x="40" y="420" width="200" height="60" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="40" y="420" width="200" height="24" rx="6" fill="rgba(45,49,66,0.04)"/>
      <line x1="40" y1="444" x2="240" y2="444" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
      <text x="140" y="436" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«external»</text>
      <text x="140" y="460" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HTTPXAsyncClient</text>
      <text x="140" y="480" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">httpx</text>

      <!-- Legend: relationship vocabulary -->
      <line x1="40" y1="490" x2="960" y2="490" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="506" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · RELATIONSHIPS</text>

      <line x1="40" y1="522" x2="68" y2="522" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-triangle-dashed)"/>
      <text x="76" y="526" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Realization</text>

      <line x1="220" y1="522" x2="248" y2="522" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uml-open-dashed)"/>
      <text x="256" y="526" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Dependency · uses</text>

      <line x1="420" y1="522" x2="448" y2="522" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uml-open-dashed)"/>
      <text x="456" y="526" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External dependency</text>
    </svg>
  </div>
</body>
</html>
